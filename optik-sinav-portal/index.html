<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Optik Sınav Portalı • Çoklu Kurum Deneme Sınavı & Kamera ile Hızlı Okuma</title>
  <meta name="description" content="Kurslar ve okullar için telefon kamerasıyla optik form okuma, anında net hesaplama ve sıralama platformu.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Özel Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    /* Canlı Animasyon */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Ana Uygulama Kapsayıcısı -->
  <div id="app-root"></div>

  <!-- JavaScript Modülleri -->
  <script src="js/store.js"></script>
  <script src="js/optical-sheet-generator.js"></script>
  <script src="js/omr-scanner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
