<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Optik Sınav Portalı • Çoklu Kurum Deneme Sınavı & Kamera ile Hızlı Okuma</title>
  <meta name="description" content="Kurslar ve okullar için telefon kamerasıyla optik form okuma, anında net hesaplama ve sıralama platformu.">
  
  <script>
    window.onerror = function(msg, url, line) {
      console.error('Portal Hatası:', msg, url, line);
      const root = document.getElementById('app-root');
      if (root && root.innerHTML.includes('Portala Bağlanılıyor')) {
        root.innerHTML = `
          <div style="min-height:100vh; background:#090d16; color:#f8fafc; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; font-family:system-ui, sans-serif; text-align:center;">
            <div style="font-size:42px; margin-bottom:12px;">⚠️</div>
            <h2 style="font-size:18px; font-weight:bold; color:#f43f5e; margin-bottom:8px;">Portal Yüklenirken Bir Bildirim Oluştu</h2>
            <div style="background:#1e293b; padding:12px 18px; border-radius:12px; font-family:monospace; font-size:12px; color:#cbd5e1; max-width:550px; text-align:left; word-break:break-all; border:1px solid #334155; margin-bottom:16px;">
              <strong>Detay:</strong> ${msg}<br>
              <strong>Dosya:</strong> ${url ? url.split('/').pop() : 'Bilinmiyor'} (Satır ${line})
            </div>
            <button onclick="localStorage.clear(); sessionStorage.clear(); location.reload();" style="padding:10px 20px; background:#10b981; color:#022c22; font-weight:bold; font-size:13px; border:none; border-radius:10px; cursor:pointer;">
              Hafızayı Temizle ve Yeniden Başlat ⟳
            </button>
          </div>
        `;
      }
    };
  </script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Mobilde Yatay Sayfa Taşmasını Kesin Olarak Önleyen Kural */
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-text-size-adjust: 100%;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    #app-root {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      position: relative;
    }
    /* Tablo ve Önizleme Konteynerleri için Akıcı Dokunmatik Kaydırma */
    .overflow-x-auto {
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }

    /* Özel Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    /* Canlı Animasyon */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }

    /* ==========================================
       TEMA SİSTEMİ (DARK / LIGHT / NAVY / EMERALD)
       ========================================== */
    /* 1. Açık Tema (Gündüz Modu) */
    html.theme-light body,
    html.theme-light #app-root,
    html.theme-light .bg-slate-950 {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    html.theme-light .bg-slate-900 {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border-color: #e2e8f0 !important;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05) !important;
    }
    html.theme-light .bg-slate-950\/80,
    html.theme-light .bg-slate-950\/70,
    html.theme-light .bg-slate-950\/60 {
      background-color: #f1f5f9 !important;
    }
    html.theme-light .border-slate-800,
    html.theme-light .border-slate-800\/80,
    html.theme-light .border-slate-800\/60,
    html.theme-light .border-slate-800\/50,
    html.theme-light .divide-slate-800,
    html.theme-light .divide-slate-800\/80,
    html.theme-light .divide-slate-800\/60 {
      border-color: #e2e8f0 !important;
    }
    html.theme-light .text-white,
    html.theme-light .text-slate-100 {
      color: #0f172a !important;
    }
    html.theme-light .text-slate-200 {
      color: #1e293b !important;
    }
    html.theme-light .text-slate-300 {
      color: #334155 !important;
    }
    html.theme-light .text-slate-400,
    html.theme-light .text-slate-500 {
      color: #64748b !important;
    }
    html.theme-light input,
    html.theme-light select,
    html.theme-light textarea {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
    }
    html.theme-light input:focus,
    html.theme-light select:focus,
    html.theme-light textarea:focus {
      border-color: #10b981 !important;
    }
    html.theme-light .bg-slate-800 {
      background-color: #e2e8f0 !important;
      color: #0f172a !important;
    }
    html.theme-light .bg-slate-800\/80,
    html.theme-light .bg-slate-800\/60 {
      background-color: #e2e8f0 !important;
    }
    html.theme-light .hover\:bg-slate-800:hover,
    html.theme-light .hover\:bg-slate-700:hover {
      background-color: #cbd5e1 !important;
      color: #0f172a !important;
    }
    html.theme-light .hover\:bg-slate-800\/40:hover {
      background-color: #f1f5f9 !important;
    }
    html.theme-light thead.bg-slate-950 {
      background-color: #f1f5f9 !important;
    }

    /* 2. Gece Mavisi (Ocean Navy) */
    html.theme-navy body,
    html.theme-navy #app-root,
    html.theme-navy .bg-slate-950 {
      background-color: #060b17 !important;
    }
    html.theme-navy .bg-slate-900 {
      background-color: #0c162d !important;
      border-color: #1a2c54 !important;
    }
    html.theme-navy .border-slate-800,
    html.theme-navy .border-slate-800\/80,
    html.theme-navy .border-slate-800\/60,
    html.theme-navy .divide-slate-800,
    html.theme-navy .divide-slate-800\/80 {
      border-color: #1a2c54 !important;
    }
    html.theme-navy .bg-slate-800 {
      background-color: #16254a !important;
    }
    html.theme-navy input,
    html.theme-navy select,
    html.theme-navy textarea {
      background-color: #070e22 !important;
      border-color: #1a2c54 !important;
      color: #f1f5f9 !important;
    }

    /* 3. Zümrüt Yeşili (Emerald Orman) */
    html.theme-emerald body,
    html.theme-emerald #app-root,
    html.theme-emerald .bg-slate-950 {
      background-color: #041009 !important;
    }
    html.theme-emerald .bg-slate-900 {
      background-color: #092014 !important;
      border-color: #123824 !important;
    }
    html.theme-emerald .border-slate-800,
    html.theme-emerald .border-slate-800\/80,
    html.theme-emerald .border-slate-800\/60,
    html.theme-emerald .divide-slate-800,
    html.theme-emerald .divide-slate-800\/80 {
      border-color: #123824 !important;
    }
    html.theme-emerald .bg-slate-800 {
      background-color: #0f2e1d !important;
    }
    html.theme-emerald input,
    html.theme-emerald select,
    html.theme-emerald textarea {
      background-color: #05160d !important;
      border-color: #123824 !important;
      color: #f1f5f9 !important;
    }
  </style>
  <script>
    (function(){
      try {
        const t = localStorage.getItem('optik_portal_theme') || 'dark';
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('theme-light');
        } else {
          document.documentElement.classList.add('dark');
          if (t !== 'dark') document.documentElement.classList.add('theme-' + t);
        }
      } catch(e){}
    })();
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Ana Uygulama Kapsayıcısı -->
  <div id="app-root">
    <div class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-xs text-slate-400 font-bold uppercase tracking-wider">Portala Bağlanılıyor...</p>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (Compat - CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- jsQR: Optik Form QR Kod Çözücü -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <!-- SheetJS: Excel (.xlsx, .xls) ve Tablo Çözücü -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- JavaScript Modülleri (Önbellek Korumalı & Çift Dizin Destekli) -->
  <script src="firebase-config.js?v=20261028_v7" onerror="this.onerror=null;this.src='js/firebase-config.js?v=20261028_v7';"></script>
  <script src="cloud-sync.js?v=20261028_v7" onerror="this.onerror=null;this.src='js/cloud-sync.js?v=20261028_v7';"></script>
  <script src="store.js?v=20261028_v7" onerror="this.onerror=null;this.src='js/store.js?v=20261028_v7';"></script>
  <script src="optical-sheet-generator.js?v=20261028_v7" onerror="this.onerror=null;this.src='js/optical-sheet-generator.js?v=20261028_v7';"></script>
  <script src="omr-scanner.js?v=20261028_v7" onerror="this.onerror=null;this.src='js/omr-scanner.js?v=20261028_v7';"></script>
  <script src="app.js?v=20261028_v7" onerror="this.onerror=null;this.src='js/app.js?v=20261028_v7';"></script>
  <script>
    if (window.App && typeof window.App.init === 'function') {
      try {
        window.App.init();
      } catch (e) {
        console.error('App.init çalıştırma hatası:', e);
      }
    }

    // Acil durum kurtarıcısı: 1 saniye içinde yükleme bitmezse login ekranını zorla bas
    setTimeout(() => {
      const root = document.getElementById('app-root');
      if (root && root.innerHTML.includes('Portala Bağlanılıyor')) {
        if (window.App && typeof window.App.renderLoginView === 'function') {
          root.innerHTML = window.App.renderLoginView();
        }
      }
    }, 1000);
  </script>
</body>
</html>
